schema: spec-driven

context: |
  Язык артефактов: русский. Сохранять структурные заголовки OpenSpec и ключевые слова SHALL/MUST на английском.
  Проект: Go 1.25.5, одна самостоятельная программа в week-02, без day-* каталогов.
  Runtime-провайдер выбирается флагом: Groq по умолчанию и DeepSeek как OpenAI-compatible fallback.
  API-ключи читаются только из environment; не печатаются и не записываются в конфигурацию.
  Требуются SQLite-персистентность, полноэкранный TUI и пять стратегий контекста: full, summary, sliding, facts, branching.
  Ошибки должны fail-fast без retry/backoff. Артефакты OpenSpec, исходный код и документация — на русском языке.
